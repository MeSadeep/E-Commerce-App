name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server tests + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm audit --audit-level=high || true # warns without failing the build; tighten once deps are pinned

  client:
    name: Client build + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm install
      - run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:4000
          REACT_APP_AUTH0_DOMAIN: test-tenant.us.auth0.com
          REACT_APP_AUTH0_CLIENT_ID: test-client-id
          REACT_APP_AUTH0_AUDIENCE: https://test-audience
      - run: npm audit --audit-level=high || true
